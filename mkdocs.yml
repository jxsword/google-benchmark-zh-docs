site_name: google-benchmark 中文文档
site_description: Google Benchmark 官方文档中文翻译（社区非官方版，Apache-2.0）
site_author: jxsword
site_url: https://jxsword.github.io/google-benchmark-zh-docs/
repo_url: https://github.com/jxsword/google-benchmark-zh-docs
repo_name: jxsword/google-benchmark-zh-docs
edit_uri: edit/main/zh/
copyright: 译文基于 Apache-2.0 的 google/benchmark 官方文档翻译，非 Google 官方项目

docs_dir: zh
site_dir: site

theme:
  name: material
  language: zh
  palette:
    # 自动切换浅色/深色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-night
        name: 切换浅色模式
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - 首页: index.md
  - 用户指南: user_guide.md
  - 命令行工具: tools.md
  - 降低方差: reducing_variance.md
  - 随机交错: random_interleaving.md
  - 性能计数器: perf_counters.md
  - 汇编测试: AssemblyTests.md
  - Python 绑定: python_bindings.md
  - Bazel: bazel.md
  - 依赖: dependencies.md
  - 平台特定构建说明: platform_specific_build_instructions.md
  - 发布流程: releasing.md
  - 关于本翻译: about.md

markdown_extensions:
  # 标题 {#slug} 注入依赖 attr_list（fix_links --anchors 产出的页内锚点）
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables
  - def_list
  - admonition

plugins:
  - search
